<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Design</title>
    <style>
    .cv-container-timeline {
  max-width: 800px;
  margin: auto;
  padding: 40px 20px;
  font-family: 'Segoe UI', sans-serif;
  background-color: #f4f7f9;
  position: relative; /* relative to position the photo absolute */
  padding-top: 120px; /* photo ke liye thodi jagah upar */
}



.cv-container-timeline h1 {
  text-align: center;
  font-size: 2.5rem;
  margin-bottom: 5px;
}

.cv-container-timeline p {
  text-align: center;
  margin: 0;
  color: #555;
}

.cv-section {
  background-color: white;
  margin: 30px auto;
  padding: 20px;
  border-left: 4px solid #3498db;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
  position: relative;
}

.cv-section h2 {
  margin-top: 0;
  color: #2c3e50;
}

.cv-section::before {
  content: '';
  position: absolute;
  left: -11px;
  top: 20px;
  width: 20px;
  height: 20px;
  background-color: #3498db;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 0 0 3px #ecf0f1;
}
#photoContainer {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px; /* photo ki width */
  height: 150px; /* photo ki height */
  overflow: hidden;
  border-radius: 10px;
  background-color: white;
}

#photoContainer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#print {
  margin: 30px auto;
  display: block;
  padding: 10px 20px;
  font-size: 18px;
  background-color: #0077b6;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s;
}


    </style>
    
</head>
<body>
    <div class="cv-container-timeline">
      <div id="photoContainer" src="">
  <img id="cvPhoto">
</div>

  <h1 id="intro">Your Name</h1>
  <p id="cvPhone">📞 Phone</p>
  <p id="cvEmail">📧 Email</p>
  <p id="address">🏠 Address</p>

  <div class="cv-section">
    <h2>🎯 Career Objective</h2>
    <p id="cvCareerObjective"></p>
  </div>

  <div class="cv-section">
    <h2>📚 Education</h2>
   <ul id="cvEducation"></ul>
        <ul>
        <li id="class12"><b>Intermediate</b> (Year) - Institution Name</li>
        <li id="class10"><b>High School</b> (Year) - Institution Name</li>
        </ul>  </div>

  <div class="cv-section">
    <h2>🛠️ Skills</h2>
    <p id="cvSkills"></p>
  </div>

  <div class="cv-section">
    <h2>💼 Experience</h2>
    <p id="cvExperience"></p>
  </div>

  <div class="cv-section">
    <h2>📅 Personal Details</h2>
    <p id="cvDob"></p>
    <p id="cvFather"></p>
    <p id="cvField"></p>
    <p id="cvCountry"></p>
    <p id="cvState"></p>
    <p id="cvlang"></p>
    <p id="cvMarital"></p>
  </div>
</div>

<button id="print" onclick="window.print()">🖨 Print / 📩 Download PDF</button>
<script src="cvScript.js"></script>

      
</body>
</html>
