    <script>
        function submitCV(event) {
            event.preventDefault(); // Form submit hone se rokna
    
            // Form se data lena
            let formData = {
                name: document.getElementById("name").value,
                fname: document.getElementById("fname").value,
                dob: document.getElementById("dob").value,
                phone:document.getElementById("phone").value,
                email: document.getElementById("email").value,
                skills: Array.from(document.getElementsByName("skills")).map(input => input.value),
                country: document.getElementById("country").value,
                state: document.getElementById("state").value,
                house: document.getElementById("Address").value,
                education: Array.from(document.getElementsByName("Education")).map(input => input.value),
                class10: document.getElementById("class10").value,
                class12: document.getElementById("class12").value,
                field: document.getElementById("cv_feild").value,
                lang: document.getElementById("lang").value,
                Marital: document.getElementById("Marital").value,
                experience: document.getElementById("expCheckbox").checked ? {
                    company: document.getElementById("Company").value,
                    years: document.getElementById("Years").value
                } : null
            };
    
            // Data ko localStorage mein save karna
            localStorage.setItem("cvData", JSON.stringify(formData));
    
            // CV preview page par le jana
            window.location.href = "Demo.html";
                    }

                    const photoInput=document.getElementById("photo");
                    const previewImage=document.getElementById("preview");
                    photoInput.addEventListener("change", function(){
                        const file=this.files[0];
                        if(file){
                            const reader= new FileReader();
                            reader.onload=function(){
                                previewImage.src= reader.result;
                                previewImage.style.display="block";
                                localStorage.setItem("cvPhoto",reader.result);
                                
                            }
                            reader.readAsDataURL(file);
                        }
                        
                    })
                    function addEducation() {
    const container = document.getElementById("educationContainer");

    const wrapperDiv = document.createElement("div");
    wrapperDiv.style.display = "flex";
    wrapperDiv.style.alignItems = "center";
    wrapperDiv.style.gap = "10px";
    wrapperDiv.style.marginTop = "5px";

    // Create the input field
    const input = document.createElement("input");
    input.type = "text";
    input.name = "Education";
    input.placeholder = "Enter other course or qualification";
    input.required = true;
    input.style.flex = "1";

    // Create the remove button
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.textContent = "❌ Remove";
    removeBtn.style.backgroundColor = "crimson";
    removeBtn.style.color = "white";
    removeBtn.style.border = "none";
    removeBtn.style.padding = "5px 10px";
    removeBtn.style.borderRadius = "5px";
    removeBtn.style.cursor = "pointer";

    // Remove logic
    removeBtn.onclick = () => {
        container.removeChild(wrapperDiv);
    };

    // Append input and button to wrapperDiv, then to container
    wrapperDiv.appendChild(input);
    wrapperDiv.appendChild(removeBtn);
    container.appendChild(wrapperDiv);
}
function addSkills(){
    console.log("Hi Enter new skill")
    const container=document.getElementById("skillsContainer");
    const wrapper=document.createElement("div");
    wrapper.style.display="flex";
    wrapper.style.alignItems="center";
    wrapper.style.gap="10px";
    wrapper.style.marginBottom="8px";
    const input=document.createElement("input");
    input.type="text";
    input.name="skills";
    input.placeholder="Enter another skill";
    input.required="true";
    input.style.flex="1";
    const removeBtn=document.createElement("button");
    removeBtn.type="button";
    removeBtn.textContent="❌ Remove";
    removeBtn.style.backgroundColor="crimson";
    removeBtn.style.color="white";
    removeBtn.style.border="none";
    removeBtn.style.padding="5px 10px";
    removeBtn.style.cursor="pointer";
    removeBtn.onclick= ()=>{
        container.removeChild(wrapper);
    }
    wrapper.appendChild(input);
    wrapper.appendChild(removeBtn);
    container.appendChild(wrapper);
}
    </script>
