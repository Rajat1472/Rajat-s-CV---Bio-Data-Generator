<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Design</title>
    <style>
       .cv-container {
  display: flex;
  font-family: 'Poppins', sans-serif;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

.left-sidebar {
  width: 30%;
  background-color: #2c3e50;
  color: white;
  padding: 20px;
  text-align: center;
}

.left-sidebar .profile-pic {
  width: 120px;
  height: 120px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.right-section {
  width: 70%;
  padding: 30px;
  background-color: #fff;
}

.right-section h3 {
  color: #2c3e50;
  border-bottom: 2px solid #ecf0f1;
  margin-top: 20px;
}

.right-section p {
  margin: 5px 0;
}
#print {
  margin: 30px auto;
  display: block;
  padding: 10px 20px;
  font-size: 18px;
  background-color: #0077b6;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s;
}
@media (max-width: 600px) {
    body {
        margin: 0;
        overflow-x: hidden;
    }

    .cv-container {
        width: 1000px;
        transform: scale(0.38);
        transform-origin: top left;
    }

    #print {
        display: none;
    }
}    </style>
     </head>
<body>
    <div class="cv-container">
  <div class="left-sidebar">
    <img id="cvPhoto" alt="Profile Photo" class="profile-pic" />
    <h2 id="intro">Your Name</h2>
    <p id="cvPhone">📞 Phone</p>
    <p id="cvEmail">📧 Email</p>
    <p id="address">🏠 Address</p>
    <p id="cvlang">🌐 Languages</p>
    <p id="cvMarital">💍 Marital Status</p>
  </div>
  <div class="right-section">
    <h3>🎯 Career Objective</h3>
    <p id="cvCareerObjective"></p>

    <h3>🎓 Education</h3>
   <ul id="cvEducation"></ul>
        <ul>
        <li id="class12"><b>Intermediate</b> (Year) - Institution Name</li>
        <li id="class10"><b>High School</b> (Year) - Institution Name</li>
        </ul>
    <h3>🛠️ Skills</h3>
    <ul id="cvSkills"></p>

    <h3>💼 Experience</h3>
    <p id="cvExperience"></p>

    <h3>📅 Additional Info</h3>
    <p id="cvDob"></p>
    <p id="cvFather"></p>
    <p id="cvField"></p>
    <p id="cvCountry"></p>
    <p id="cvState"></p>
  </div>
</div>

<button id="print" onclick="window.print()">🖨 Print / 📩 Download PDF</button>
<script src="cvScript.js"></script>
</body>
</html>
