<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio data Form</title>

    <style>
     * {
    box-sizing: border-box;
}

    body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 30px 15px;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: white;
        text-align: center;
    }

    h1 {
        margin: 10px 0 8px;
        font-size: 32px;
    }

    body > p {
        margin-bottom: 25px;
        font-size: 17px;
    }

    form {
    background: rgba(255, 255, 255, 0.95);
    color: #222;
    width: 70%;
    max-width: 850px;
    margin: auto;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    text-align: left;
}

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
        color: #222;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin: 0;
        border: 1px solid #aaa;
        border-radius: 7px;
        font-size: 15px;
        font-weight: normal;
        background: white;
        transition: 0.2s;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #0072ff;
        box-shadow: 0 0 5px rgba(0, 114, 255, 0.35);
    }

    input[type="file"] {
        padding: 8px;
    }

    input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
    }

    input[type="submit"] {
        width: 100%;
        background: #0072ff;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        padding: 13px;
        border-radius: 8px;
        margin-top: 20px;
    }

    input[type="submit"]:hover {
        background: #0056c7;
    }

    .skill-container {
        margin-bottom: 10px;
    }

    .add-btn {
        background-color: darkgreen;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        margin-top: 8px;
        float: right;
        font-weight: bold;
        cursor: pointer;
    }

    .add-btn:hover {
        background-color: seagreen;
    }

    #preview {
        max-width: 150px;
        display: none;
        border: 1px solid black;
        padding: 4px;
        border-radius: 5px;
        margin: 10px 0;
    }

    #experienceFeilds {
        margin-top: 10px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 8px;
    }

    #skillsContainer,
    #educationContainer {
        margin-bottom: 15px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {

        body {
            padding: 20px 10px;
        }

        h1 {
            font-size: 26px;
        }

        body > p {
            font-size: 15px;
        }

        form {
            width: 100%;
            padding: 20px 15px;
            border-radius: 10px;
        }

        input,
        select {
            font-size: 16px;
            padding: 12px;
        }

        .add-btn {
            float: none;
            width: 100%;
            margin-top: 8px;
        }
    }

    /* Small Mobile */
    @media (max-width: 768px) {
    form {
        width: 100%;
        padding: 20px 15px;
    }

    input,
    select {
        font-size: 16px;
        padding: 12px;
    }

    .add-btn {
        float: none;
        width: 100%;
    }
}

@media (max-width: 480px) {
    form {
        padding: 18px 12px;
    }
}      
    #preview {
        display: none;
        width: 100px;
        height: 120px;
        object-fit: cover;
        border: 2px solid black;
        
    }</style>
</head>
<body>
    <h1>Welcome to Bio Data Form</h1>
<p>Kindly Fill the follwing details required.</p> 
<form onsubmit="saveData(event)">

<label for="Address">House Number</label><br><br>

<input type="text" id="birth_place" name="birth_place" required><br><br>
<div id="educationContainer">
<label for="Education">Education</label><br><br>
<input type="text" id="Education"  name="Education"required><br><br>
<button type="button" class="add-btn" onclick="addEducation()">Add any other courses</button><br><br>
</div>
<label for="occupation">Occupation</label><br><br>
<input type="text" id="occupation" name="Occupation"required><br><br>
<label for="photo"> Upload Your Photo</label>
<input type="file" id="photo">
<img id="preview" src="" alt="Image preview">
<input type="submit"value="submit">

</form>
<script>
    const photoInput=document.getElementById("photo");
    const reader=new FileReader();
    const preview = document.getElementById("preview");
    photoInput.addEventListener('change', function(){
        const file=this.files[0];
        if(file){
            reader.readAsDataURL(file);
            reader.onload=function(){
                console.log('image preview url:',reader.result);
                preview.src=reader.result;
                preview.style.display="block";
                localStorage.setItem("photo",reader.result)
            };
        }
    });
    
    function saveData(event){
        event.preventDefault();
        const totalSisters=document.getElementById("totalSisters").value;
    const marriedSisters=document.getElementById("marriedSisters").value;
    const totalBrothers=document.getElementById("totalBrothers").value;
    const marriedBrothers=document.getElementById("marriedBrothers").value;
    const SistersInfo=`${marriedSisters}/${totalSisters} married`;
    const BrothersInfo=`${marriedBrothers}/${totalBrothers} married`;
        const Data={
            name:document.getElementById("name").value,
            fname:document.getElementById('fname').value,
            Mname:document.getElementById('Mname').value,
            Complexion:document.getElementById('Complexion').value,
            Height:document.getElementById('Height').value,
            Religion:document.getElementById('Religion').value,
            Caste:document.getElementById('Caste').value,
            Contact:document.getElementById('Contact').value,
            dob:document.getElementById('dob').value,
            Salary:document.getElementById('Salary').value,
            country: document.getElementById("country").value,
            state: document.getElementById("state").value,
            birth_place: document.getElementById("birth_place").value,
            Education: Array.from(document.getElementsByName("Education")).map(input => input.value),
            occupation: document.getElementById("occupation").value,
            Address: document.getElementById("Address").value,
            Sisters:SistersInfo,
            Brothers:BrothersInfo,
            photo:preview.src
              
    };
    localStorage.setItem("bioData",JSON.stringify(Data))
    window.location.href="bioDataDemo.html";
    }
    function addEducation(){
                let wrapper=document.createElement("div");
                wrapper.style.display = "flex";
                wrapper.style.alignItems = "center";
                wrapper.style.gap = "10px";
                wrapper.style.marginTop = "5px"; // ya marginBottom

                let newEducation=document.createElement("input");
                newEducation.type="Text";
                newEducation.name="Education";
                newEducation.placeholder="Enter any other Courses";
                let rembtn=document.createElement("button");
                rembtn.type="button";
                rembtn.onclick=function(){wrapper.remove()};
                rembtn.textContent = "❌ Remove";
                rembtn.style.display="inline-flex";
                rembtn.style.backgroundColor = "crimson";
                rembtn.style.color = "white";
                rembtn.style.border = "none";
                rembtn.style.padding = "5px 10px";
                rembtn.style.borderRadius = "5px";
                rembtn.style.cursor = "pointer";
                rembtn.style.whiteSpace = "nowrap";
                wrapper.appendChild(newEducation);
                wrapper.appendChild(rembtn);
                document.getElementById("educationContainer").appendChild(wrapper);
}
</script> 
<script src="bio_dataScript.js"></script>

</html>
